<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v1.88 主題中心驗證</title><link rel="stylesheet" href="../css/app.css?v=1.88"><style>body{background:#f3f6fa}.testShell{max-width:1280px;margin:auto;padding:24px}.formBlock{padding:24px;border:1px solid #d8e2ec;border-radius:18px;background:#fff}</style></head>
<body><main class="testShell"><div id="editorPaneAppearanceV181"><div class="formBlock"><div class="themeSettings"><h4>問卷主題</h4><input id="formTheme" type="hidden" value="appleWhite"><div id="themeChoices" class="themeChoices"></div></div></div></div></main>
<script>
  const $=id=>document.getElementById(id),forms=[];let formDirty=false;
  const FORM_THEMES_V132=[['appleWhite','企業簡約','#fff','#f5f8fb','#245f9e'],['oceanBlue','清新藍綠','#155e75','#e5f7f6','#168a87'],['sunnyOrange','暖米行政','#9a5b25','#fbf3e8','#b56c2f'],['forestGreen','自然植感','#2f6d58','#edf7f1','#3c8068'],['sinotechRed','活動活力','#b8332c','#fff0e8','#e06a3a'],['sakura','自訂封面','#385d85','#edf3fa','#326fa8'],['mistGray','霧灰極簡','#34465a','#f2f4f6','#536f8a'],['navyGold','深藍典雅','#142e52','#f7f2e6','#aa7b28'],['lavenderCare','淡紫關懷','#695b8f','#f5f1fa','#7d68aa'],['paperWarm','紙張暖白','#6b543d','#faf6ed','#916b42'],['techGradient','科技漸層','#3154a4','#edf2ff','#5856c8'],['freshIllustration','清新插畫','#237c79','#eff9f6','#df7969'],['brandCustom','自訂品牌','#245f9e','#f3f6fa','#245f9e']].map(x=>({id:x[0],label:x[1],a:x[2],b:x[3],accent:x[4]}));
  const esc=value=>String(value),attr=value=>String(value),imageUrl=value=>String(value||''),activeForm=()=>null,markFormDirty=()=>{formDirty=true};
  function formTheme(f){return FORM_THEMES_V132.some(t=>t.id===(f?.theme||'appleWhite'))?(f?.theme||'appleWhite'):'appleWhite'}
  function renderThemeChoices(selected){formTheme({theme:selected});$('formTheme').value=selected;$('themeChoices').innerHTML=FORM_THEMES_V132.map(t=>`<button type="button" class="themeCard ${selected===t.id?'active':''}" onclick="selectTheme('${t.id}')"><span class="themeSwatch" style="--a:${t.a};--b:${t.b};--accent:${t.accent}"></span><b>${t.label}</b></button>`).join('')}
  function selectTheme(id){$('formTheme').value=id;renderThemeChoices(id);formDirty=true}
  function startNewForm(){} function editForm(){} function setEditorTabV181(){} function renderFront(){} async function submitResponse(){}
</script><script src="../js/product-v188.js?v=1.88"></script><script>renderThemeChoices('appleWhite')</script></body></html>
